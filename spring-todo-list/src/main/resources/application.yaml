spring:
  application:
    name: spring-todo-list

  datasource:
    url: jdbc:h2:mem:todo_list
    driver-class-name: org.h2.Driver
    username: root
    password: h2password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
